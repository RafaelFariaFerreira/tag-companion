<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0.5" y="0.5" width="879" height="199" rx="12" fill="#FAF8F6" stroke="#E2DCD7"/>
  <g transform="translate(40 40)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#6F6660" stroke-width="4"/>
    <text x="0" y="72" font-size="17" font-weight="600" fill="#231C19">Carregado</text>
    <text x="0" y="96" font-size="13" fill="#6F6660">O script do vendor</text>
    <text x="0" y="114" font-size="13" fill="#6F6660">chegou à página.</text>
  </g>
  <g transform="translate(250 40)">
    <circle cx="20" cy="20" r="16" fill="#2E7D4F"/>
    <text x="0" y="72" font-size="17" font-weight="600" fill="#231C19">Disparado</text>
    <text x="0" y="96" font-size="13" fill="#6F6660">Um hit saiu e o vendor</text>
    <text x="0" y="114" font-size="13" fill="#6F6660">respondeu 2xx / 3xx.</text>
  </g>
  <g transform="translate(460 40)">
    <path d="M8 8 L32 32 M32 8 L8 32" stroke="#C4302B" stroke-width="5.5" stroke-linecap="round"/>
    <text x="0" y="72" font-size="17" font-weight="600" fill="#231C19">Falhou</text>
    <text x="0" y="96" font-size="13" fill="#6F6660">Bloqueado, cancelado</text>
    <text x="0" y="114" font-size="13" fill="#6F6660">ou HTTP 4xx / 5xx.</text>
  </g>
  <g transform="translate(670 40)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#E0A030" stroke-width="5" stroke-dasharray="7 6"/>
    <text x="0" y="72" font-size="17" font-weight="600" fill="#231C19">Carregou, não disparou</text>
    <text x="0" y="96" font-size="13" fill="#6F6660">A biblioteca está na página,</text>
    <text x="0" y="114" font-size="13" fill="#6F6660">mas nenhum hit saiu.</text>
  </g>
</svg>
