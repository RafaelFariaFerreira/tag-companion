<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O caminho de um purchase</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8f4f1;
      --color-ink:     #1d1614;
      --color-muted:   #615955;
      --color-accent:  #b54016;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequência · Tag Companion</p>
    <h1>O caminho de um purchase</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="event-sequence-title event-sequence-desc">
        <title id="event-sequence-title">O caminho de um purchase</title>
        <desc id="event-sequence-desc">Diagrama de sequência mostrando um evento purchase saindo do dataLayer da loja, passando pelo page-observer e pelo content-bridge até o service worker, que casa o push com o hit GA4 observado na rede, confirma o 204 e envia SESSION_UPDATE para o painel.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#615955"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b54016"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2c6194"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#615955" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8f4f1"/>

        <!-- LIFELINES · centers 140, 340, 540, 740, 940, 1140 -->
        <line x1="140" y1="96" x2="140" y2="600" stroke="rgba(29,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="340" y1="96" x2="340" y2="600" stroke="rgba(29,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="540" y1="96" x2="540" y2="600" stroke="rgba(29,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="740" y1="96" x2="740" y2="600" stroke="rgba(29,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="940" y1="96" x2="940" y2="600" stroke="rgba(29,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1140" y1="96" x2="1140" y2="600" stroke="rgba(29,22,20,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="336" y="168" width="8" height="72" fill="rgba(29,22,20,0.06)" stroke="#615955" stroke-width="0.8"/>
        <rect x="536" y="232" width="8" height="72" fill="rgba(29,22,20,0.06)" stroke="#615955" stroke-width="0.8"/>
        <rect x="736" y="296" width="8" height="256" fill="rgba(29,22,20,0.06)" stroke="#615955" stroke-width="0.8"/>
        <!-- nested: decode + correlate -->
        <rect x="740" y="360" width="8" height="72" fill="rgba(29,22,20,0.10)" stroke="#615955" stroke-width="0.8"/>
        <rect x="1136" y="536" width="8" height="32" fill="rgba(29,22,20,0.06)" stroke="#615955" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <!-- M1 · loja → page-observer (call) -->
        <line x1="140" y1="168" x2="336" y2="168" stroke="#615955" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M2 · page-observer → content-bridge (async postMessage) -->
        <line x1="344" y1="232" x2="536" y2="232" stroke="#615955" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <!-- M3 · content-bridge → SW -->
        <line x1="544" y1="296" x2="736" y2="296" stroke="#615955" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M4 · Rede → SW (GA4 hit observed) -->
        <line x1="940" y1="360" x2="748" y2="360" stroke="#2c6194" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M5 · Rede → SW (response status, return) -->
        <line x1="940" y1="472" x2="744" y2="472" stroke="#615955" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M6 · SW → Interface (headline) -->
        <line x1="744" y1="536" x2="1136" y2="536" stroke="#b54016" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- LABELS (masked, above) + sublabels (below) -->
        <rect x="196" y="148" width="88" height="12" rx="2" fill="#f8f4f1"/>
        <text x="240" y="157" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DATALAYER.PUSH</text>
        <text x="240" y="186" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">event: "purchase"</text>

        <rect x="404" y="212" width="72" height="12" rx="2" fill="#f8f4f1"/>
        <text x="440" y="221" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POSTMESSAGE</text>
        <text x="440" y="250" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MAIN → ISOLATED</text>

        <rect x="608" y="276" width="64" height="12" rx="2" fill="#f8f4f1"/>
        <text x="640" y="285" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PAGE EVENT</text>
        <text x="640" y="314" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">runtime.sendMessage</text>

        <rect x="812" y="340" width="64" height="12" rx="2" fill="#f8f4f1"/>
        <text x="844" y="349" fill="#2c6194" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/G/COLLECT</text>
        <text x="844" y="378" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">en=purchase</text>
        <text x="844" y="391" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">onBeforeRequest</text>

        <rect x="824" y="452" width="40" height="12" rx="2" fill="#f8f4f1"/>
        <text x="844" y="461" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">204 OK</text>
        <text x="844" y="490" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">onCompleted · disparado</text>

        <rect x="996" y="516" width="88" height="12" rx="2" fill="#f8f4f1"/>
        <text x="1040" y="525" fill="#b54016" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SESSION_UPDATE</text>
        <text x="1040" y="554" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">port.postMessage</text>

        <!-- CALLOUT · decode + correlate (nested activation) -->
        <text x="712" y="386" fill="#1d1614" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">decodifica o hit e casa</text>
        <text x="712" y="404" fill="#1d1614" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">com o push: event_id ou</text>
        <text x="712" y="422" fill="#1d1614" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">janela de 3 s</text>
        <path d="M 716 396 L 734 396" fill="none" stroke="rgba(29,22,20,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="736" cy="396" r="2" fill="#1d1614"/>

        <!-- ACTORS -->
        <!-- Código da loja · external -->
        <rect x="60" y="40" width="160" height="56" rx="6" fill="#f8f4f1"/>
        <rect x="60" y="40" width="160" height="56" rx="6" fill="rgba(29,22,20,0.03)" stroke="rgba(29,22,20,0.30)" stroke-width="1"/>
        <rect x="68" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(29,22,20,0.22)" stroke-width="0.8"/>
        <text x="82" y="55" fill="#615955" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SITE</text>
        <text x="140" y="74" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Código da loja</text>
        <text x="140" y="88" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gtag · dataLayer</text>

        <!-- page-observer · backend -->
        <rect x="260" y="40" width="160" height="56" rx="6" fill="#f8f4f1"/>
        <rect x="260" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#1d1614" stroke-width="1"/>
        <rect x="268" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(29,22,20,0.40)" stroke-width="0.8"/>
        <text x="282" y="55" fill="#615955" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MAIN</text>
        <text x="340" y="74" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">page-observer</text>
        <text x="340" y="88" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mundo da página</text>

        <!-- content-bridge · backend -->
        <rect x="460" y="40" width="160" height="56" rx="6" fill="#f8f4f1"/>
        <rect x="460" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#1d1614" stroke-width="1"/>
        <rect x="468" y="46" width="48" height="12" rx="2" fill="transparent" stroke="rgba(29,22,20,0.40)" stroke-width="0.8"/>
        <text x="492" y="55" fill="#615955" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ISOLATED</text>
        <text x="540" y="74" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">content-bridge</text>
        <text x="540" y="88" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">content script</text>

        <!-- Service worker · focal -->
        <rect x="660" y="40" width="160" height="56" rx="6" fill="#f8f4f1"/>
        <rect x="660" y="40" width="160" height="56" rx="6" fill="rgba(229,102,54,0.10)" stroke="#b54016" stroke-width="1"/>
        <rect x="668" y="46" width="24" height="12" rx="2" fill="transparent" stroke="rgba(181,64,22,0.50)" stroke-width="0.8"/>
        <text x="680" y="55" fill="#b54016" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MV3</text>
        <text x="740" y="74" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Service worker</text>
        <text x="740" y="88" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">correlator · sessão</text>

        <!-- Rede · external -->
        <rect x="860" y="40" width="160" height="56" rx="6" fill="#f8f4f1"/>
        <rect x="860" y="40" width="160" height="56" rx="6" fill="rgba(29,22,20,0.03)" stroke="rgba(29,22,20,0.30)" stroke-width="1"/>
        <rect x="868" y="46" width="24" height="12" rx="2" fill="transparent" stroke="rgba(29,22,20,0.22)" stroke-width="0.8"/>
        <text x="880" y="55" fill="#615955" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
        <text x="940" y="74" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rede</text>
        <text x="940" y="88" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chrome.webRequest</text>

        <!-- Interface · input -->
        <rect x="1060" y="40" width="160" height="56" rx="6" fill="#f8f4f1"/>
        <rect x="1060" y="40" width="160" height="56" rx="6" fill="rgba(97,89,85,0.10)" stroke="#6e6662" stroke-width="1"/>
        <rect x="1068" y="46" width="20" height="12" rx="2" fill="transparent" stroke="rgba(110,102,98,0.40)" stroke-width="0.8"/>
        <text x="1078" y="55" fill="#615955" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="1140" y="74" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Interface</text>
        <text x="1140" y="88" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Painel · Side Panel</text>

        <!-- LEGEND -->
        <line x1="60" y1="636" x2="1220" y2="636" stroke="rgba(29,22,20,0.10)" stroke-width="0.8"/>
        <text x="60" y="656" fill="#615955" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGENDA</text>

        <rect x="60" y="672" width="14" height="10" rx="2" fill="rgba(229,102,54,0.10)" stroke="#b54016" stroke-width="1"/>
        <text x="80" y="680" fill="#615955" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Ator focal</text>

        <rect x="200" y="668" width="4" height="18" fill="rgba(29,22,20,0.06)" stroke="#615955" stroke-width="0.8"/>
        <text x="212" y="680" fill="#615955" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Ativação</text>

        <line x1="320" y1="677" x2="348" y2="677" stroke="#615955" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="356" y="680" fill="#615955" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Mensagem</text>

        <line x1="476" y1="677" x2="504" y2="677" stroke="#615955" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="512" y="680" fill="#615955" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Assíncrona</text>

        <line x1="636" y1="677" x2="664" y2="677" stroke="#2c6194" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="672" y="680" fill="#615955" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Requisição observada</text>

        <line x1="836" y1="677" x2="864" y2="677" stroke="#615955" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="872" y="680" fill="#615955" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Retorno</text>

        <line x1="996" y1="677" x2="1024" y2="677" stroke="#b54016" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="1032" y="680" fill="#615955" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Caminho principal</text>
      </svg>
    </div>
  </div>
</body>
</html>
