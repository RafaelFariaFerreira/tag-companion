<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Os quatro estados de um tag</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8f4f1;
      --color-ink:     #1d1614;
      --color-muted:   #615955;
      --color-accent:  #b54016;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Máquina de estados · Tag Companion</p>
    <h1>Os quatro estados de um tag</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tag-states-title tag-states-desc">
        <title id="tag-states-title">Os quatro estados de um tag</title>
        <desc id="tag-states-desc">Máquina de estados do Tag Companion: um tag começa Carregado e passa a Disparado quando um hit volta 2xx/3xx, a Falhou quando é bloqueado ou volta 4xx, ou a Carregou, não disparou quando nenhum hit sai, podendo ainda virar Disparado se um hit chegar depois.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#615955"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b54016"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2c6194"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8f4f1"/>

        <!-- Transitions (drawn first) -->
        <!-- Start → Carregado -->
        <line x1="70" y1="280" x2="112" y2="280" stroke="#615955" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Carregado → Disparado -->
        <path d="M 312 264 L 392 264 A 8 8 0 0 0 400 256 L 400 128 A 8 8 0 0 1 408 120 L 616 120" fill="none" stroke="#615955" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Carregado → Carregou, não disparou -->
        <line x1="312" y1="280" x2="616" y2="280" stroke="#615955" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Carregado → Falhou -->
        <path d="M 312 296 L 432 296 A 8 8 0 0 1 440 304 L 440 432 A 8 8 0 0 0 448 440 L 616 440" fill="none" stroke="#615955" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Carregou, não disparou → Disparado (late hit) -->
        <line x1="756" y1="248" x2="756" y2="152" stroke="#615955" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Transition labels -->
        <rect x="488" y="100" width="80" height="12" rx="2" fill="#f8f4f1"/>
        <text x="528" y="109" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HIT 2XX/3XX</text>

        <rect x="500" y="260" width="56" height="12" rx="2" fill="#f8f4f1"/>
        <text x="528" y="269" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SEM HIT</text>

        <rect x="480" y="420" width="96" height="12" rx="2" fill="#f8f4f1"/>
        <text x="528" y="429" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BLOQUEADO/4XX</text>

        <rect x="764" y="194" width="68" height="12" rx="2" fill="#f8f4f1"/>
        <text x="768" y="203" fill="#6e6662" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">HIT CHEGOU</text>

        <!-- Initial pseudo-state -->
        <circle cx="64" cy="280" r="6" fill="#1d1614"/>

        <!-- State: Carregado -->
        <rect x="112" y="248" width="200" height="64" rx="8" fill="#f8f4f1"/>
        <rect x="112" y="248" width="200" height="64" rx="8" fill="#ffffff" stroke="#1d1614" stroke-width="1"/>
        <circle cx="132" cy="272" r="4.5" fill="none" stroke="#615955" stroke-width="1.5"/>
        <text x="144" y="276" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Carregado</text>
        <text x="128" y="296" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">script do vendor na página</text>

        <!-- State: Disparado (focal) -->
        <rect x="616" y="88" width="280" height="64" rx="8" fill="#f8f4f1"/>
        <rect x="616" y="88" width="280" height="64" rx="8" fill="rgba(229,102,54,0.10)" stroke="#b54016" stroke-width="1.2"/>
        <circle cx="636" cy="120" r="5" fill="#b54016"/>
        <text x="648" y="124" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Disparado</text>

        <!-- State: Carregou, não disparou -->
        <rect x="616" y="248" width="280" height="64" rx="8" fill="#f8f4f1"/>
        <rect x="616" y="248" width="280" height="64" rx="8" fill="rgba(29,22,20,0.05)" stroke="#615955" stroke-width="1"/>
        <circle cx="636" cy="272" r="4.5" fill="none" stroke="#615955" stroke-width="1.5" stroke-dasharray="2.2,1.6"/>
        <text x="648" y="276" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Carregou, não disparou</text>
        <text x="632" y="296" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">biblioteca carregada, nenhum envio</text>

        <!-- State: Falhou -->
        <rect x="616" y="408" width="280" height="64" rx="8" fill="#f8f4f1"/>
        <rect x="616" y="408" width="280" height="64" rx="8" fill="#ffffff" stroke="#1d1614" stroke-width="1"/>
        <polygon points="631.5,428.5 636,433 640.5,428.5 641.5,429.5 637,434 641.5,438.5 640.5,439.5 636,435 631.5,439.5 630.5,438.5 635,434 630.5,429.5" fill="#1d1614"/>
        <text x="648" y="438" fill="#1d1614" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Falhou</text>
        <text x="632" y="456" fill="#615955" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ERR_BLOCKED_BY_CLIENT · ERR_ABORTED · 4xx/5xx</text>

        <!-- Legend -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(29,22,20,0.12)" stroke-width="0.8"/>
        <text x="40" y="560" fill="#615955" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGENDA</text>
        <circle cx="140" cy="557" r="4" fill="#1d1614"/>
        <text x="152" y="560" fill="#615955" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">INÍCIO</text>
        <line x1="236" y1="557" x2="268" y2="557" stroke="#615955" stroke-width="1.2"/>
        <text x="276" y="560" fill="#615955" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">TRANSIÇÃO NA HORA</text>
        <line x1="412" y1="557" x2="444" y2="557" stroke="#615955" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="452" y="560" fill="#615955" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">HIT TARDIO</text>
      </svg>
    </div>
  </div>
</body>
</html>
